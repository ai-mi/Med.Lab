name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Jobb for å bygge og teste applikasjonen
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout koden fra repo
      - name: Checkout code
        uses: actions/checkout@v2
        
      # Step 2: Set up .NET SDK
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '10.x'
          
      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ./src/Med.Labs.sln

      # Step 4: Bygg prosjektet
      - name: Build project
        run: dotnet build ./src/Med.Labs.sln --configuration Release --no-restore

      # Step 5: Kjør enhetstester
      - name: Run unit tests
        run: dotnet test ./tests/UnitTests/UnitTests.csproj --configuration Release --no-build

      # Step 6: Kjør integrasjonstester
      - name: Run integration tests
        run: dotnet test ./tests/IntegrationTests/IntegrationTests.csproj --configuration Release --no-build

  # Jobb for å bygge Docker-image (optional, hvis du bruker Docker)
  docker_build_and_push:
    runs-on: ubuntu-latest
    needs: build_and_test
    if: success()

    steps:
      # Step 1: Checkout koden fra repo
      - name: Checkout code
        uses: actions/checkout@v2
        
      # Step 2: Bygg Docker image
      - name: Build Docker image
        run: |
          docker build -t med-labs:latest ./src/Med.Labs.Api/
        
      # Step 3: Pushe Docker image til DockerHub (eller annen registry)
      - name: Push Docker image to DockerHub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker tag med-labs:latest ${{ secrets.DOCKER_USERNAME }}/med-labs:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/med-labs:latest
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        
  # Jobb for deploy til server / sky (optional, kan være Azure, AWS, GCP)
  deploy:
    runs-on: ubuntu-latest
    needs: docker_build_and_push
    if: success()

    steps:
      # Step 1: Checkout koden
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: SSH til server og deploy applikasjonen
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /path/to/app
            docker pull ${{ secrets.DOCKER_USERNAME }}/med-labs:latest
            docker-compose down
            docker-compose up -d
